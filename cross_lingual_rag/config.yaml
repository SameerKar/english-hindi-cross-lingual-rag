# Master Configuration for English-Hindi Cross-Lingual Academic RAG Experimentation Platform
# All experiment settings, model identifiers, and hyperparameters are strictly frozen here.

project_name: "English-Hindi Cross-Lingual Academic RAG Experimentation Platform"
version: "2.0"
random_seed: 42

paths:
  corpus_dir: "data/corpus"
  processed_dir: "data/processed"
  english_index_dir: "data/indexes/english"
  multilingual_index_dir: "data/indexes/multilingual"
  benchmark_file: "data/benchmark/questions.csv"
  results_raw_dir: "results/raw"
  results_csv_dir: "results/csv"
  results_summary_dir: "results/summaries"
  prompts_dir: "prompts"

embedding:
  # Monolingual English embedding for Systems B & C
  english_model: "sentence-transformers/all-mpnet-base-v2"
  # Cross-lingual embedding for System D (Zero-shot Hindi<->English, lightweight ~120MB)
  multilingual_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  # L2 normalization ensures Inner Product equals Cosine Similarity
  normalize_embeddings: true
  device: "cpu" # Options: "cpu", "cuda"
  batch_size: 32

retrieval:
  top_k: 5
  chunk_size: 700
  chunk_overlap: 80
  metric: "cosine"

generation:
  # Provider options: "openai", "gemini", "ollama", "mock"
  provider: "gemini"
  model: "gemini-3.1-flash-lite"
  # Strict constraint: Temperature must be 0 for research reproducibility
  temperature: 0.0
  max_new_tokens: 512
  # Environment variable names for API keys
  openai_api_key_env: "OPENAI_API_KEY"
  gemini_api_key_env: "GEMINI_API_KEY"
  ollama_base_url: "http://localhost:11434"

translation:
  # Provider options: "deep-translator" (free Google web API), "google_cloud", "mock"
  provider: "deep-translator"
  source_lang: "hi"
  target_lang: "en"

evaluation:
  benchmark_file: "data/benchmark/questions.csv"
  k_values: [1, 3, 5]

systems:
  A_direct_llm: true
  B_english_rag: true
  C_translation_rag: true
  D_multilingual_rag: true
